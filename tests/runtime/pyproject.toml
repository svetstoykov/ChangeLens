[project]
name = "changelens-review"
version = "0.1.0"
description = "Runtime review tool that drives the ChangeLens engine over its protocol."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.2"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["changelens_review"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # ruff format owns line length; long message strings stay whole

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["engine: builds and runs the real ChangeLens engine (slow)"]
addopts = "-m 'not engine'"
